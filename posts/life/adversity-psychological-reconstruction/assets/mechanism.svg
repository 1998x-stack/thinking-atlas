<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="mechanism-title mechanism-desc">
<title id="mechanism-title">重大挫折后的心理系统变化与重建条件</title>
<desc id="mechanism-desc">原有行动反馈系统遭遇资源、关系和角色冲击后，可能出现不同适应轨迹。安全、社会支持和可控行动是重建系统的重要条件。此图是解释框架，不是统计数据。</desc>
<defs>
<marker id="m-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#9b735b"/></marker>
