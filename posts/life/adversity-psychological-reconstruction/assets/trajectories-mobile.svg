<title id="tm-title">重大压力后的四种概念性适应轨迹：移动版</title>
<desc id="tm-desc">横轴为事件后的时间，纵轴为心理与日常功能水平。四种曲线分别表示相对稳定、逐渐恢复、持续困扰和延迟反应。无真实数据点。</desc>
