<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="trajectory-title trajectory-desc">
<title id="trajectory-title">重大压力后的四种概念性适应轨迹</title>
<desc id="trajectory-desc">横轴为事件发生后的时间，纵轴为心理与日常功能水平。四条概念曲线分别表示相对稳定、逐渐恢复、持续困扰和延迟反应。曲线没有真实数据点，不用于预测个体。</desc>
