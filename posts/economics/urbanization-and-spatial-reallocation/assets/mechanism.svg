<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">城市人口与产业分化机制</title><desc id="desc">城市分化由就业、产业链、公共服务、交通可达性、住房成本和财政能力共同决定，不是简单沿海内陆二分。</desc>
<rect width="1200" height="720" fill="#f4f5ef"/><text x="70" y="78" fill="#173d3b" font-size="23" font-family="sans-serif" font-weight="700">THINKING ATLAS / URBAN ECONOMICS</text>
<text x="70" y="150" fill="#173d3b" font-size="48" font-family="serif">城市分化，不是沿海内陆二分</text><text x="70" y="194" fill="#607774" font-size="20" font-family="sans-serif">人口、工作、产业与公共服务的空间均衡</text>
<g font-family="sans-serif">
<rect x="80" y="260" width="270" height="190" rx="12" fill="#dcebe3" stroke="#80a99b" stroke-width="2"/><text x="215" y="305" text-anchor="middle" fill="#276b5f" font-size="22" font-weight="700">就业机会</text><text x="215" y="365" text-anchor="middle" fill="#173d3b" font-size="28">工资与岗位</text><text x="215" y="407" text-anchor="middle" fill="#607774" font-size="17">本地市场 / 外部订单</text>
<rect x="465" y="260" width="270" height="190" rx="12" fill="#e8eee5" stroke="#a8b9a9" stroke-width="2"/><text x="600" y="305" text-anchor="middle" fill="#657b58" font-size="22" font-weight="700">产业链密度</text><text x="600" y="365" text-anchor="middle" fill="#173d3b" font-size="28">企业协作</text><text x="600" y="407" text-anchor="middle" fill="#607774" font-size="17">人才 / 供应商 / 客户</text>
<rect x="850" y="260" width="270" height="190" rx="12" fill="#f3e8df" stroke="#d1a98b" stroke-width="2"/><text x="985" y="305" text-anchor="middle" fill="#a06b49" font-size="22" font-weight="700">城市生活条件</text><text x="985" y="365" text-anchor="middle" fill="#173d3b" font-size="28">服务与成本</text><text x="985" y="407" text-anchor="middle" fill="#7c6757" font-size="17">教育 / 医疗 / 住房 / 通勤</text>
<path d="M350 355 H465 M735 355 H850" stroke="#2d766c" stroke-width="4" fill="none"/><path d="M452 342 L466 355 L452 368 M837 342 L851 355 L837 368" stroke="#2d766c" stroke-width="4" fill="none"/>
<rect x="80" y="500" width="1040" height="120" rx="12" fill="#173d3b"/><text x="600" y="545" text-anchor="middle" fill="#c5ddd1" font-size="19">人口流动与地方财政是结果，也是反馈变量</text><text x="600" y="590" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">产业 × 人口 × 服务 × 财政 × 可达性</text>
</g></svg>