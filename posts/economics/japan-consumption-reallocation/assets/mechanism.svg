<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">日本消费结构迁移机制</title><desc id="desc">收入和价格预期变化经由消费者替代、零售渠道竞争、企业效率和市场份额变化，形成消费结构迁移。</desc><rect width="1200" height="680" fill="#f4f5ef"/><text x="70" y="78" fill="#173d3b" font-size="23" font-family="sans-serif" font-weight="700">THINKING ATLAS / JAPAN RETAIL</text><text x="70" y="150" fill="#173d3b" font-size="46" font-family="serif">消费需求没有消失，而是在重新分配</text><g font-family="sans-serif"><rect x="70" y="245" width="225" height="155" rx="14" fill="#dcebe3" stroke="#80a99b" stroke-width="2"/><text x="182" y="290" text-anchor="middle" fill="#276b5f" font-size="22" font-weight="700">宏观环境</text><text x="182" y="340" text-anchor="middle" fill="#173d3b" font-size="19">收入预期 / 物价</text><text x="182" y="370" text-anchor="middle" fill="#607774" font-size="16">人口 / 利率 / 资产</text><rect x="360" y="245" width="225" height="155" rx="14" fill="#e8eee5" stroke="#a8b9a9" stroke-width="2"/><text x="472" y="290" text-anchor="middle" fill="#657b58" font-size="22" font-weight="700">消费者替代</text><text x="472" y="340" text-anchor="middle" fill="#173d3b" font-size="19">品牌 / 规格 / 渠道</text><text x="472" y="370" text-anchor="middle" fill="#607774" font-size="16">频率 / 时点 / 便利</text><rect x="650" y="245" width="225" height="155" rx="14" fill="#f3e8df" stroke="#d1a98b" stroke-width="2"/><text x="762" y="290" text-anchor="middle" fill="#a06b49" font-size="22" font-weight="700">企业竞争</text><text x="762" y="340" text-anchor="middle" fill="#173d3b" font-size="19">采购 / 周转 / 服务</text><text x="762" y="370" text-anchor="middle" fill="#7c6757" font-size="16">门店效率 / 供应链</text><rect x="940" y="245" width="190" height="155" rx="14" fill="#e6edf0" stroke="#9db3bd" stroke-width="2"/><text x="1035" y="290" text-anchor="middle" fill="#456978" font-size="22" font-weight="700">市场结果</text><text x="1035" y="340" text-anchor="middle" fill="#173d3b" font-size="19">份额重分配</text><text x="1035" y="370" text-anchor="middle" fill="#607b86" font-size="16">销量 / 利润分化</text><g stroke="#2d766c" stroke-width="4" fill="none"><path d="M295 322 H360 M585 322 H650 M875 322 H940"/><path d="M346 310 L360 322 L346 334 M636 310 L650 322 L636 334 M926 310 L940 322 L926 334"/></g><rect x="70" y="475" width="1060" height="105" rx="12" fill="#173d3b"/><text x="110" y="520" fill="#c5ddd1" font-size="19">必须区分：</text><text x="110" y="558" fill="#fff" font-size="27" font-weight="700">名义销售额 ≠ 实际销量 ≠ 企业利润 ≠ 资本回报</text></g></svg>