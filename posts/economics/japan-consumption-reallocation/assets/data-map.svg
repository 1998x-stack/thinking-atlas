<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">2025年日本零售业态销售额同比</title><desc id="desc">METI统计：药妆店5.5%，超市4.7%，大型家电4.1%，便利店3.4%，整体零售1.4%，家居中心负0.2%，百货店负1.8%。</desc><rect width="1000" height="620" fill="#f7f8f4"/><text x="55" y="65" font-size="30" fill="#173d3b" font-family="serif">2025年日本零售业态销售额同比</text><text x="55" y="98" font-size="16" fill="#6b7c77" font-family="sans-serif">METI 商业动态统计；名义销售额，非利润增速</text><line x1="360" y1="145" x2="360" y2="510" stroke="#8b9993" stroke-width="2"/><g font-family="sans-serif" font-size="20" fill="#173d3b"><text x="55" y="190">药妆店</text><text x="55" y="240">超市</text><text x="55" y="290">大型家电</text><text x="55" y="340">便利店</text><text x="55" y="390">整体零售</text><text x="55" y="440">家居中心</text><text x="55" y="490">百货店</text></g><g fill="#2d766c"><rect x="360" y="165" width="330" height="30" rx="5"/><rect x="360" y="215" width="282" height="30" rx="5"/><rect x="360" y="265" width="246" height="30" rx="5"/><rect x="360" y="315" width="204" height="30" rx="5"/><rect x="360" y="365" width="84" height="30" rx="5"/></g><g fill="#a06b49"><rect x="348" y="415" width="12" height="30" rx="4"/><rect x="270" y="465" width="90" height="30" rx="4"/></g><g font-family="sans-serif" font-size="19" fill="#173d3b"><text x="705" y="190">+5.5%</text><text x="657" y="240">+4.7%</text><text x="621" y="290">+4.1%</text><text x="579" y="340">+3.4%</text><text x="459" y="390">+1.4%</text><text x="373" y="440">-0.2%</text><text x="255" y="490">-1.8%</text></g><text x="55" y="565" fill="#657b75" font-size="15" font-family="sans-serif">注：业态增速同时受价格、销量、门店数量和统计分类影响；不能直接推断利润。</text></svg>