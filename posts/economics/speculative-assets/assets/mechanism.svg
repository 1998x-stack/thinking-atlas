<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 245" role="img" aria-labelledby="tt dd"><title id="tt">藏獒、君子兰、赌石、翡翠与房地产：价格如何形成？概念流程</title><desc id="dd">四步概念解释：使用价值、稀缺性、转售预期、流动性。这是研究框架，不是统计数据。</desc><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#b47657"/></marker></defs><rect width="900" height="245" rx="16" fill="#edf4ed"/><text x="48" y="46" fill="#7b796b" font-size="13" letter-spacing="2">CONCEPTUAL MECHANISM · NOT MEASURED DATA</text><path d="M217 130H246" fill="none" stroke="#b47657" stroke-width="2" marker-end="url(#a)"/><path d="M429 130H458" fill="none" stroke="#b47657" stroke-width="2" marker-end="url(#a)"/><path d="M641 130H670" fill="none" stroke="#b47657" stroke-width="2" marker-end="url(#a)"/><rect x="48" y="86" width="169" height="88" rx="13" fill="#ffffff" stroke="#a4c9b8"/><text x="132" y="123" text-anchor="middle" font-size="18" font-weight="650" fill="#173d40">使用价值</text><text x="132" y="149" text-anchor="middle" font-size="10" fill="#657f7c">STEP 01</text><rect x="260" y="86" width="169" height="88" rx="13" fill="#ffffff" stroke="#a4c9b8"/><text x="344" y="123" text-anchor="middle" font-size="18" font-weight="650" fill="#173d40">稀缺性</text><text x="344" y="149" text-anchor="middle" font-size="10" fill="#657f7c">STEP 02</text><rect x="472" y="86" width="169" height="88" rx="13" fill="#ffffff" stroke="#a4c9b8"/><text x="556" y="123" text-anchor="middle" font-size="18" font-weight="650" fill="#173d40">转售预期</text><text x="556" y="149" text-anchor="middle" font-size="10" fill="#657f7c">STEP 03</text><rect x="684" y="86" width="169" height="88" rx="13" fill="#d2e5db" stroke="#a4c9b8"/><text x="768" y="123" text-anchor="middle" font-size="18" font-weight="650" fill="#173d40">流动性</text><text x="768" y="149" text-anchor="middle" font-size="10" fill="#657f7c">STEP 04</text><text x="450" y="216" text-anchor="middle" fill="#638278" font-size="12">解释框架 / 变量关系 · 并非独立实证证明</text></svg>