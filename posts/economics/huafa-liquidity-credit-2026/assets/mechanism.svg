<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 600" role="img" aria-labelledby="t d"><title id="t">企业可用现金与付息、再融资、资产处置的关系</title><desc id="d">经营净现金流、实际到账的新融资与资产出售款流入可支配现金池，该池向本金利息及经营支出支付；现金流紧张可能引发信用利差上升，进一步提高再融资难度。本图是概念机制而不是财务数据。</desc><rect x="0" y="0" width="1070" height="600" rx="25" fill="#f8fafc"/><text x="46" y="64" font-size="30" font-weight="700" fill="#172e46" font-family="sans-serif">CASH FLOW &amp; CREDIT / 现金不是资产标价</text><text x="46" y="103" font-size="19" fill="#566a7b" font-family="sans-serif">现金流分析：只将已经可支配的实际到账款计入现金池</text><g font-family="sans-serif" text-anchor="middle">
<rect x="62" y="164" width="256" height="125" rx="21" fill="#e7f5ed" stroke="#78ae91"/><text x="190" y="210" font-size="25" font-weight="700" fill="#1a6144">经营净现金流</text><text x="190" y="250" font-size="18" fill="#3a755c">收入 − 经营支付</text>
<rect x="409" y="164" width="256" height="125" rx="21" fill="#e8f0ff" stroke="#7b9fd5"/><text x="537" y="210" font-size="25" font-weight="700" fill="#284e81">可用现金池</text><text x="537" y="250" font-size="18" fill="#4b6e9a">支付能力的真正约束</text>
<rect x="752" y="164" width="256" height="125" rx="21" fill="#fff0e6" stroke="#c9906c"/><text x="880" y="210" font-size="25" font-weight="700" fill="#975329">本息与必要支出</text><text x="880" y="250" font-size="18" fill="#a36b44">到期债务 · 维持运营</text>
<rect x="62" y="385" width="256" height="125" rx="21" fill="#e8f0ff" stroke="#7b9fd5"/><text x="190" y="430" font-size="25" font-weight="700" fill="#284e81">再融资实际到账</text><text x="190" y="472" font-size="18" fill="#4b6e9a">授信不是同一回事</text>
<rect x="409" y="385" width="256" height="125" rx="21" fill="#e7f5ed" stroke="#78ae91"/><text x="537" y="430" font-size="25" font-weight="700" fill="#1a6144">出售款实际到账</text><text x="537" y="472" font-size="18" fill="#3a755c">拟售／签约 ≠ 回款</text>
<rect x="752" y="385" width="256" height="125" rx="21" fill="#fff0e6" stroke="#c9906c"/><text x="880" y="430" font-size="25" font-weight="700" fill="#975329">信用预期变化</text><text x="880" y="472" font-size="18" fill="#a36b44">利差 · 期限 · 续发</text></g><g stroke="#8496a7" stroke-width="3" fill="none" stroke-linecap="round"><path d="M318 226H406m-16 -9 16 9 -16 9"/><path d="M665 226H749m-16 -9 16 9 -16 9"/><path d="M190 385V325H461V293m-9 17 9 -17 9 17"/><path d="M537 385V293m-9 16 9 -16 9 16"/><path d="M880 289V382m-9 -16 9 16 9 -16"/></g><text x="537" y="561" text-anchor="middle" font-size="18" fill="#536578" font-family="sans-serif">信用预期影响融资条件；并不自动等于已经发生法律意义上的债券违约</text></svg>