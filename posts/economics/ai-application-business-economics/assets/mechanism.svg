<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">AI应用商业化价值链</title><desc id="desc">AI应用商业化依赖客户问题、工作流嵌入、可评估结果、正向单位经济和持续分发，而不是只依赖模型能力。</desc>
<rect width="1200" height="720" fill="#f4f5ef"/><text x="70" y="78" fill="#173d3b" font-size="23" font-family="sans-serif" font-weight="700">THINKING ATLAS / AI BUSINESS</text>
<text x="70" y="150" fill="#173d3b" font-size="48" font-family="serif">模型能力 ≠ 商业价值</text><text x="70" y="194" fill="#607774" font-size="20" font-family="sans-serif">把模型变成可靠、可付费、可复制的工作流</text>
<g font-family="sans-serif">
<rect x="65" y="270" width="195" height="190" rx="12" fill="#dcebe3" stroke="#80a99b" stroke-width="2"/><text x="162" y="315" text-anchor="middle" fill="#276b5f" font-size="20" font-weight="700">客户问题</text><text x="162" y="370" text-anchor="middle" fill="#173d3b" font-size="25">高频</text><text x="162" y="410" text-anchor="middle" fill="#607774" font-size="16">有预算 / 可量化</text>
<rect x="300" y="270" width="195" height="190" rx="12" fill="#e8eee5" stroke="#a8b9a9" stroke-width="2"/><text x="397" y="315" text-anchor="middle" fill="#657b58" font-size="20" font-weight="700">工作流</text><text x="397" y="370" text-anchor="middle" fill="#173d3b" font-size="25">嵌入</text><text x="397" y="410" text-anchor="middle" fill="#607774" font-size="16">数据 / 权限 / 系统</text>
<rect x="535" y="270" width="195" height="190" rx="12" fill="#f3e8df" stroke="#d1a98b" stroke-width="2"/><text x="632" y="315" text-anchor="middle" fill="#a06b49" font-size="20" font-weight="700">结果质量</text><text x="632" y="370" text-anchor="middle" fill="#173d3b" font-size="25">可评估</text><text x="632" y="410" text-anchor="middle" fill="#7c6757" font-size="16">成功率 / 返工率</text>
<rect x="770" y="270" width="195" height="190" rx="12" fill="#e6edf0" stroke="#9db3bd" stroke-width="2"/><text x="867" y="315" text-anchor="middle" fill="#456978" font-size="20" font-weight="700">单位经济</text><text x="867" y="370" text-anchor="middle" fill="#173d3b" font-size="25">正毛利</text><text x="867" y="410" text-anchor="middle" fill="#607b86" font-size="16">推理 / 人审 / CAC</text>
<rect x="1005" y="270" width="135" height="190" rx="12" fill="#eee8f1" stroke="#b9a9c3" stroke-width="2"/><text x="1072" y="315" text-anchor="middle" fill="#79638b" font-size="20" font-weight="700">分发</text><text x="1072" y="370" text-anchor="middle" fill="#173d3b" font-size="23">复购</text><text x="1072" y="410" text-anchor="middle" fill="#84758f" font-size="15">续费 / 扩张</text>
<g stroke="#2d766c" stroke-width="4" fill="none"><path d="M260 365 H300 M495 365 H535 M730 365 H770 M965 365 H1005"/><path d="M287 353 L301 365 L287 377 M522 353 L536 365 L522 377 M757 353 L771 365 L757 377 M992 353 L1006 365 L992 377"/></g>
</g>
<rect x="65" y="525" width="1075" height="105" rx="12" fill="#173d3b"/><text x="105" y="570" fill="#c5ddd1" font-size="18">真正的护城河通常不是单一模型，而是：</text><text x="105" y="610" fill="#fff" font-size="26" font-weight="700">工作流 × 数据权利 × 评估反馈 × 分发 × 可靠交付</text></svg>