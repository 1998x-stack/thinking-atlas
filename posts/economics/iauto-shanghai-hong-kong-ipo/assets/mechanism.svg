<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>商泰汽车控制链及证据边界</title><desc>上层控股人未知，商泰科技至上海商泰汽车的100%关系来自二手工商资料，美国同名主体不连线。</desc><rect width="720" height="440" rx="20" fill="#f4f7f7"/><g font-family="sans-serif" text-anchor="middle" font-size="20" fill="#20383d"><rect x="36" y="28" width="400" height="76" rx="12" fill="#fff" stroke="#79858a" stroke-dasharray="7 5"/><text x="236" y="59">最终控股人／发行人</text><text x="236" y="85" font-size="16" fill="#5b666a">尚未识别</text><path d="M236 104V151" stroke="#79858a" stroke-width="3" stroke-dasharray="7 5"/><rect x="36" y="152" width="400" height="72" rx="12" fill="#dbe9ec" stroke="#517783"/><text x="236" y="194">商泰科技（上海）有限公司</text><path d="M236 224V283" stroke="#326b73" stroke-width="3"/><text x="284" y="260" font-size="17">100%*</text><rect x="36" y="284" width="400" height="74" rx="12" fill="#d5ece4" stroke="#357563"/><text x="236" y="314">上海商泰汽车信息系统</text><text x="236" y="339" font-size="17">境内经营主体</text><rect x="462" y="152" width="222" height="206" rx="12" fill="#fff0df" stroke="#ac7534"/><text x="573" y="190" font-size="18">美国同名主体</text><text x="573" y="222" font-size="17">iAuto Group Inc.</text><text x="573" y="259" font-size="16">未证实股权关系</text><text x="573" y="289" font-size="16">不合并计算</text><text x="360" y="405" font-size="16" fill="#5b666a">* 来源：2026年10月媒体转引工商股东表；原始档案待核验</text></g></svg>