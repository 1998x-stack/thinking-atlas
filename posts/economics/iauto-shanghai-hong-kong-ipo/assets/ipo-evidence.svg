<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img"><title>上市证据核验阶梯</title><desc>经营主体有公开资料，发行人、保荐人、递表、备案及挂牌均尚未确认；不代表实际进度。</desc><rect width="640" height="460" rx="18" fill="#f4f7f7"/><g font-family="sans-serif" font-size="20" fill="#20383d"><rect x="48" y="24" width="544" height="50" rx="10" fill="#d5ece4" stroke="#357563"/><text x="320" y="55" text-anchor="middle">经营主体与直接股东：有线索</text><path d="M320 74V92" stroke="#869398" stroke-width="2"/><rect x="48" y="92" width="544" height="50" rx="10" fill="#ffffff" stroke="#869398" stroke-dasharray="5 4"/><text x="320" y="123" text-anchor="middle">最终发行人：未知</text><path d="M320 142V160" stroke="#869398" stroke-width="2"/><rect x="48" y="160" width="544" height="50" rx="10" fill="#ffffff" stroke="#869398" stroke-dasharray="5 4"/><text x="320" y="191" text-anchor="middle">保荐人及筹备：未确认</text><path d="M320 210V228" stroke="#869398" stroke-width="2"/><rect x="48" y="228" width="544" height="50" rx="10" fill="#ffffff" stroke="#869398" stroke-dasharray="5 4"/><text x="320" y="259" text-anchor="middle">正式递表：未确认</text><path d="M320 278V296" stroke="#869398" stroke-width="2"/><rect x="48" y="296" width="544" height="50" rx="10" fill="#ffffff" stroke="#869398" stroke-dasharray="5 4"/><text x="320" y="327" text-anchor="middle">证监会备案：未确认</text><path d="M320 346V364" stroke="#869398" stroke-width="2"/><rect x="48" y="364" width="544" height="50" rx="10" fill="#ffffff" stroke="#869398" stroke-dasharray="5 4"/><text x="320" y="395" text-anchor="middle">聆讯及挂牌：未确认</text><text x="320" y="440" font-size="15" text-anchor="middle">核验阶梯 ≠ 公司实际进展</text></g></svg>