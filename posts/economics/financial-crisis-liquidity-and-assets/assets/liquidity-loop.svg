<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">流动性挤兑反馈回路</title><desc id="desc">赎回和保证金需求导致被迫出售，资产价格下跌，抵押品价值下降，进一步触发保证金和赎回。</desc><rect width="1000" height="620" fill="#f7f8f4"/><text x="55" y="70" font-size="30" fill="#173d3b" font-family="serif">流动性挤兑的自我强化回路</text><g font-family="sans-serif"><rect x="340" y="130" width="320" height="80" rx="12" fill="#f3e8df" stroke="#d1a98b" stroke-width="2"/><text x="500" y="178" text-anchor="middle" fill="#a06b49" font-size="23" font-weight="700">赎回 / 保证金需求</text><rect x="650" y="280" width="290" height="80" rx="12" fill="#e6edf0" stroke="#9db3bd" stroke-width="2"/><text x="795" y="328" text-anchor="middle" fill="#456978" font-size="23" font-weight="700">被迫出售资产</text><rect x="340" y="430" width="320" height="80" rx="12" fill="#e8eee5" stroke="#a8b9a9" stroke-width="2"/><text x="500" y="478" text-anchor="middle" fill="#657b58" font-size="23" font-weight="700">市场价格下跌</text><rect x="60" y="280" width="290" height="80" rx="12" fill="#eee8f1" stroke="#b9a9c3" stroke-width="2"/><text x="205" y="328" text-anchor="middle" fill="#79638b" font-size="23" font-weight="700">抵押品价值下降</text><g stroke="#2d766c" stroke-width="4" fill="none"><path d="M660 170 C770 170 820 215 820 280"/><path d="M795 360 C795 415 700 470 660 470"/><path d="M340 470 C240 470 205 415 205 360"/><path d="M205 280 C205 205 270 170 340 170"/></g><g fill="#2d766c"><path d="M808 266 L820 280 L832 266"/><path d="M674 458 L660 470 L674 482"/><path d="M193 374 L205 360 L217 374"/><path d="M326 158 L340 170 L326 182"/></g><text x="500" y="570" text-anchor="middle" fill="#657b75" font-size="17">价格下跌可能反映被迫出售，不一定等于长期价值同比例下降</text></g></svg>