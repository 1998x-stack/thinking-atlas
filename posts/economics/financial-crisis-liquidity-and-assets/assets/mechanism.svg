<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">金融危机四阶段模型</title><desc id="desc">从杠杆累积到流动性挤兑、偿付能力重估和政策修复的分析框架。</desc><rect width="1200" height="700" fill="#f4f5ef"/><text x="70" y="75" font-size="23" fill="#173d3b" font-family="sans-serif" font-weight="700">THINKING ATLAS / CRISIS MECHANISM</text><text x="70" y="145" font-size="46" fill="#173d3b" font-family="serif">危机不是一个时点，而是一组反馈机制</text><g font-family="sans-serif"><rect x="65" y="240" width="235" height="190" rx="13" fill="#e8eee5" stroke="#a8b9a9" stroke-width="2"/><text x="182" y="285" text-anchor="middle" fill="#657b58" font-size="22" font-weight="700">0 杠杆累积</text><text x="182" y="340" text-anchor="middle" fill="#173d3b" font-size="18">期限错配</text><text x="182" y="372" text-anchor="middle" fill="#607774" font-size="16">抵押品 / 估值</text><rect x="355" y="240" width="235" height="190" rx="13" fill="#f3e8df" stroke="#d1a98b" stroke-width="2"/><text x="472" y="285" text-anchor="middle" fill="#a06b49" font-size="22" font-weight="700">1 流动性挤兑</text><text x="472" y="340" text-anchor="middle" fill="#173d3b" font-size="18">保证金 / 赎回</text><text x="472" y="372" text-anchor="middle" fill="#7c6757" font-size="16">被迫出售资产</text><rect x="645" y="240" width="235" height="190" rx="13" fill="#e6edf0" stroke="#9db3bd" stroke-width="2"/><text x="762" y="285" text-anchor="middle" fill="#456978" font-size="22" font-weight="700">2 偿付能力</text><text x="762" y="340" text-anchor="middle" fill="#173d3b" font-size="18">违约 / 核销</text><text x="762" y="372" text-anchor="middle" fill="#607b86" font-size="16">资本与现金流</text><rect x="935" y="240" width="200" height="190" rx="13" fill="#eee8f1" stroke="#b9a9c3" stroke-width="2"/><text x="1035" y="285" text-anchor="middle" fill="#79638b" font-size="22" font-weight="700">3 修复</text><text x="1035" y="340" text-anchor="middle" fill="#173d3b" font-size="18">政策 / 重组</text><text x="1035" y="372" text-anchor="middle" fill="#84758f" font-size="16">收入恢复</text><g stroke="#2d766c" stroke-width="4" fill="none"><path d="M300 335 H355 M590 335 H645 M880 335 H935"/><path d="M341 323 L355 335 L341 347 M631 323 L645 335 L631 347 M921 323 L935 335 L921 347"/></g><rect x="65" y="500" width="1070" height="105" rx="12" fill="#173d3b"/><text x="105" y="545" fill="#c5ddd1" font-size="18">关键区别</text><text x="105" y="585" fill="#fff" font-size="27" font-weight="700">流动性问题：现在拿不到钱；偿付能力问题：最终还不起钱</text></g></svg>