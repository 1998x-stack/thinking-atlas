<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="04-bargain-t 04-bargain-d" data-export="04-bargain.svg" font-family="system-ui, Noto Sans CJK SC, sans-serif"><title id="04-bargain-t">交涉前后的成本变化</title><desc id="04-bargain-d">示意领导在不处理与协调之间的选择随合法诉求的明确而变化。</desc><defs><marker id="04-bargain-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#53676d"/></marker></defs><rect x="0" y="0" width="640" height="360" rx="14" fill="#f3f9f6"/><rect x="25" y="24" width="280" height="72" rx="10" fill="white" stroke="#7461ba" stroke-width="2"/><text x="165.0" y="60.0" text-anchor="middle" font-size="23" fill="#7461ba" font-weight="700">交涉之前</text><text x="165.0" y="87.0" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">诉求尚未被明确</text><rect x="335" y="24" width="280" height="72" rx="10" fill="white" stroke="#147f80" stroke-width="2"/><text x="475.0" y="60.0" text-anchor="middle" font-size="23" fill="#147f80" font-weight="700">交涉之后</text><text x="475.0" y="87.0" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">事实与诉求清晰</text><path d="M165 96 V140" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#04-bargain-arrow)"/><path d="M475 96 V140" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#04-bargain-arrow)"/><rect x="25" y="142" width="280" height="80" rx="10" fill="white" stroke="#916c22" stroke-width="2"/><text x="165.0" y="182.0" text-anchor="middle" font-size="23" fill="#916c22" font-weight="700">维持现状</text><text x="165.0" y="209.0" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">可能缺少处理动力</text><rect x="335" y="142" width="280" height="80" rx="10" fill="white" stroke="#d06d4d" stroke-width="2"/><text x="475.0" y="182.0" text-anchor="middle" font-size="23" fill="#d06d4d" font-weight="700">重新评估</text><text x="475.0" y="209.0" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">协调与不协调的成本</text><path d="M475 222 V262" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#04-bargain-arrow)"/><rect x="335" y="264" width="280" height="75" rx="10" fill="white" stroke="#147f80" stroke-width="2"/><text x="475.0" y="301.5" text-anchor="middle" font-size="23" fill="#147f80" font-weight="700">可能启动协调</text><text x="475.0" y="328.5" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">不保证成功</text><text x="165" y="295" text-anchor="middle" font-size="19" fill="#53676d" font-weight="700">不是靠冲突必然获胜</text></svg>
