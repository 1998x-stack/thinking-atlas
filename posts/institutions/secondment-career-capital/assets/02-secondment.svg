<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" role="img" aria-labelledby="02-secondment-t 02-secondment-d" data-export="02-secondment.svg" font-family="system-ui, Noto Sans CJK SC, sans-serif"><title id="02-secondment-t">借调的双重组织关系</title><desc id="02-secondment-d">原单位保留人事归属，借调单位安排实际工作；正式调动需要独立程序。</desc><defs><marker id="02-secondment-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#53676d"/></marker></defs><rect x="0" y="0" width="640" height="404" rx="14" fill="#f3f9f6"/><rect x="25" y="20" width="280" height="82" rx="10" fill="white" stroke="#7461ba" stroke-width="2"/><text x="165.0" y="61.0" text-anchor="middle" font-size="23" fill="#7461ba" font-weight="700">原单位</text><text x="165.0" y="88.0" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">人事归属、原岗位</text><rect x="335" y="20" width="280" height="82" rx="10" fill="white" stroke="#147f80" stroke-width="2"/><text x="475.0" y="61.0" text-anchor="middle" font-size="23" fill="#147f80" font-weight="700">借调单位</text><text x="475.0" y="88.0" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">任务安排、劳动使用</text><path d="M165 102 V148 H280 V183" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#02-secondment-arrow)"/><path d="M475 102 V148 H360 V183" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#02-secondment-arrow)"/><rect x="180" y="185" width="280" height="78" rx="10" fill="white" stroke="#d06d4d" stroke-width="2"/><text x="320.0" y="224.0" text-anchor="middle" font-size="23" fill="#d06d4d" font-weight="700">借调人员</text><text x="320.0" y="251.0" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">完成工作，承担责任</text><path d="M320 263 V306" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#02-secondment-arrow)"/><rect x="90" y="308" width="460" height="76" rx="10" fill="white" stroke="#916c22" stroke-width="2"/><text x="320.0" y="346.0" text-anchor="middle"