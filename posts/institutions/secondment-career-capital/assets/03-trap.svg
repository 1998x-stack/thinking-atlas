<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-labelledby="03-trap-t 03-trap-d" data-export="03-trap.svg" font-family="system-ui, Noto Sans CJK SC, sans-serif"><title id="03-trap-t">能力陷阱</title><desc id="03-trap-d">高业务能力可能引来更多任务，使原岗位更依赖该人员。</desc><defs><marker id="03-trap-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#53676d"/></marker></defs><rect x="0" y="0" width="640" height="310" rx="14" fill="#f3f9f6"/><rect x="185" y="18" width="270" height="66" rx="10" fill="white" stroke="#147f80" stroke-width="2"/><text x="320.0" y="58.0" text-anchor="middle" font-size="23" fill="#147f80" font-weight="700">业务能力突出</text><path d="M455 51 H550 V125" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#03-trap-arrow)"/><rect x="355" y="127" width="260" height="68" rx="10" fill="white" stroke="#d06d4d" stroke-width="2"/><text x="485.0" y="168.0" text-anchor="middle" font-size="23" fill="#d06d4d" font-weight="700">任务继续增加</text><path d="M485 195 V250 H455" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#03-trap-arrow)"/><rect x="185" y="222" width="270" height="68" rx="10" fill="white" stroke="#916c22" stroke-width="2"/><text x="320.0" y="263.0" text-anchor="middle" font-size="23" fill="#916c22" font-weight="700">替代成本上升</text><path d="M185 256 H85 V195" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#03-trap-arrow)"/><rect x="25" y="127" width="260" height="68" rx="10" fill="white" stroke="#7461ba" stroke-width="2"/><text x="155.0" y="168.0" text-anchor="middle" font-size="23" fill="#7461ba" font-weight="700">难以脱离岗位</text><path d="M155 127 V51 H182" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#03-trap-arrow)"/><text x="320" y="112" text-anchor="middle" font-size="21" fill="#53676d" font-weight="700">可能的反馈循环</text></svg>
