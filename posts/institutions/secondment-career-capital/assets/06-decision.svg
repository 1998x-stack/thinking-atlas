<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" role="img" aria-labelledby="06-decision-t 06-decision-d" data-export="06-decision.svg" font-family="system-ui, Noto Sans CJK SC, sans-serif"><title id="06-decision-t">借调的决策门槛</title><desc id="06-decision-d">先确认合规和授权，再判断发展价值与退出安排。</desc><defs><marker id="06-decision-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#53676d"/></marker></defs><rect x="0" y="0" width="640" height="384" rx="14" fill="#f3f9f6"/><rect x="110" y="18" width="420" height="70" rx="10" fill="white" stroke="#7461ba" stroke-width="2"/><text x="320.0" y="53.0" text-anchor="middle" font-size="23" fill="#7461ba" font-weight="700">合规与授权</text><text x="320.0" y="80.0" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">确认人员身份、审批与期限</text><path d="M320 88 V110" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#06-decision-arrow)"/><rect x="110" y="113" width="420" height="70" rx="10" fill="white" stroke="#147f80" stroke-width="2"/><text x="320.0" y="148.0" text-anchor="middle" font-size="23" fill="#147f80" font-weight="700">发展价值</text><text x="320.0" y="175.0" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">技能、平台、正式路径</text><path d="M320 183 V205" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#06-decision-arrow)"/><rect x="110" y="208" width="420" height="70" rx="10" fill="white" stroke="#916c22" stroke-width="2"/><text x="320.0" y="243.0" text-anchor="middle" font-size="23" fill="#916c22" font-weight="700">退出安排</text><text x="320.0" y="270.0" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">原单位岗位与复盘节点</text><path d="M320 278 V300" fill="none" stroke="#53676d" stroke-width="2.5" marker-end="url(#06-decision-arrow)"/><rect x="110" y="303" width="420" height="70" rx="10" fill="white" stroke="#d06d4d" stroke-width="2"/><text x="320.0" y="338.0" text-anchor="middle" font-size="23" fill="#d06d4d" font-weight="700">决定是否接受</text><text x="320.0" y="365.0" text-anchor="middle" font-size="17" fill="#203035" font-weight="400">条件不清楚时继续核实</text></svg>
