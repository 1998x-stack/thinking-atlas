<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="t d">
<title id="t">检察与法院评价体系的改革时间线</title><desc id="d">2020年检察指标体系建立，2024年取消原检察业务评价指标体系，2025年检察案件质量评查制度完善及法院指标继续精简。各年份不对应单一案件审理阶段。</desc>
<rect width="1200" height="510" fill="#fafbf7"/>
<g font-family="sans-serif">
<text x="58" y="55" font-size="20" font-weight="700" fill="#1b7268">EVALUATION SYSTEMS / 2020—2025</text>
<text x="58" y="103" font-size="35" font-weight="700" fill="#1b3c37">评价方法在变：不能用旧KPI解释现行全部制度</text>
<path d="M105 257 H1110" fill="none" stroke="#aac8be" stroke-width="8" stroke-linecap="round"/>
<g>
<circle cx="120" cy="257" r="17" fill="#b75d43" stroke="#fff" stroke-width="6"/>
<rect x="58" y="144" width="260" height="91" rx="9" fill="#fff2e8" stroke="#e9c6b2"/>
<text x="74" y="176" font-size="25" font-weight="700" fill="#98553d">2020</text><text x="74" y="205" font-size="18" fill="#55463e">无罪与撤诉率列为</text><text x="74" y="226" font-size="18" fill="#55463e">需结合观察的指标</text>
<path d="M120 235 V239" stroke="#b75d43" stroke-width="3"/>
</g>
<g>
<circle cx="515" cy="257" r="17" fill="#1c8b79" stroke="#fff" stroke-width="6"/>
<rect x="365" y="287" width="300" height="124" rx="9" fill="#e4f2ec" stroke="#9fc5b7"/>
<path d="M515 271 V287" stroke="#1c8b79" stroke-width="3"/>
<text x="385" y="323" font-size="25" font-weight="700" fill="#1e6c5d">2024 · 检察</text>
<text x="385" y="354" font-size="18" fill="#385d54">不再执行原业务评价体系</text>
<text x="385" y="382" font-size="18" fill="#385d54">不再设通报值、排名通报</text>
</g>
<g>
<circle cx="890" cy="257" r="17" fill="#537890" stroke="#fff" stroke-width="6"/>
<rect x="772" y="144" width="368" height="91" rx="9" fill="#eaf0f5" stroke="#b7cad4"/>
<path d="M890 235 V239" stroke="#537890" stroke-width="3"/>
<text x="791" y="176" font-size="25" font-weight="700" fill="#456d87">2025 · 检察 / 法院</text>
<text x="791" y="203" font-size="18" fill="#415b70">检察推动“每案必检”</text>
<text x="791" y="225" font-size="18" fill="#415b70">法院管理指标进一步精简</text>
</g>
<text x="60" y="467" font-size="18" fill="#60716c">注：全国性指标改革不自动等同于地方执行效果；本图为政策时间线，不是办案绩效数据。</text>
</g></svg>