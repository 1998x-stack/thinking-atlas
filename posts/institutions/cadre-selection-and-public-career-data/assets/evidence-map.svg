<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">干部公开人事事件数据模型</title><desc id="desc">将人事公告保存为有来源、有时间、有事件类型、有原始文本的事件记录，并区分拟任、提名、当选、任命、免职和挂职。</desc>
<rect width="1100" height="500" fill="#f6f8f4"/><text x="55" y="58" fill="#173d3b" font-size="28" font-family="serif">从公告到可复核的人事事件</text>
<g font-family="sans-serif">
<rect x="65" y="110" width="220" height="240" rx="10" fill="#dcebe3" stroke="#80a99b"/><text x="175" y="150" text-anchor="middle" fill="#276b5f" font-size="21" font-weight="700">原始来源</text><text x="175" y="195" text-anchor="middle" fill="#365c54" font-size="16">政府公告</text><text x="175" y="228" text-anchor="middle" fill="#365c54" font-size="16">组织部门公示</text><text x="175" y="261" text-anchor="middle" fill="#365c54" font-size="16">人大任免决定</text><text x="175" y="294" text-anchor="middle" fill="#365c54" font-size="16">政府公报/PDF</text>
<rect x="440" y="110" width="220" height="240" rx="10" fill="#e8eee5" stroke="#a8b9a9"/><text x="550" y="150" text-anchor="middle" fill="#657b58" font-size="21" font-weight="700">事件标准化</text><text x="550" y="195" text-anchor="middle" fill="#697b62" font-size="16">姓名 / 单位 / 职务</text><text x="550" y="228" text-anchor="middle" fill="#697b62" font-size="16">公告日 / 生效日</text><text x="550" y="261" text-anchor="middle" fill="#697b62" font-size="16">事件类型 / 决定机关</text><text x="550" y="294" text-anchor="middle" fill="#697b62" font-size="16">原文 / 快照 / 哈希</text>
<rect x="815" y="110" width="220" height="240" rx="10" fill="#f3e8df" stroke="#d1a98b"/><text x="925" y="150" text-anchor="middle" fill="#a06b49" font-size="21" font-weight="700">证据审查</text><text x="925" y="195" text-anchor="middle" fill="#7c6757" font-size="16">来源去重</text><text x="925" y="228" text-anchor="middle" fill="#7c6757" font-size="16">实体消歧</text><text x="925" y="261" text-anchor="middle" fill="#7c6757" font-size="16">状态转换</text><text x="925" y="294" text-anchor="middle" fill="#7c6757" font-size="16">事实/推论/未知</text>
<path d="M285 230 H440 M660 230 H815" stroke="#2d766c" stroke-width="4" fill="none"/><path d="M426 218 L440 230 L426 242 M801 218 L815 230 L801 242" stroke="#2d766c" stroke-width="4" fill="none"/>
</g><text x="55" y="420" fill="#607774" font-size="16" font-family="sans-serif">禁止：用同名、同地任职或时间重合直接推断私人关系和任用动机。</text></svg>