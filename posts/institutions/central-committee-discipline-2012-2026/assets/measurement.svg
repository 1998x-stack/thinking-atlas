<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img"><title>统计单位的转换</title><desc>累计席位到独立人员需要名单匹配，处分事件到个体风险需要去重及完整随访。</desc><rect width="720" height="310" fill="#f6f4ee" rx="12"/><g font-family="sans-serif" fill="#253c3a" font-size="20"><rect x="35" y="35" width="650" height="58" rx="8" fill="#dbe7e2"/><text x="55" y="70">1128 累计席位（376 × 3）</text><text x="55" y="125" font-size="16">↓ 名单匹配 · 区分连任与隔届回归</text><rect x="35" y="145" width="650" height="58" rx="8" fill="#e7ddc6"/><text x="55" y="180">独立自然人数：尚待核验</text><text x="55" y="235" font-size="16">↓ 处分事件去重 · 固定观察窗口 · 完整随访</text><text x="55" y="278" font-weight="bold">自然人处分比例：尚不能精确估计</text></g></svg>