<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img"><title>三届中央委员会公报确认处分人数</title><desc>十八届35人，十九届5人，二十届51人。各以376为初始规模，非实际腐败率。</desc><rect width="720" height="350" rx="12" fill="#f6f4ee"/><g font-family="sans-serif" fill="#253c3a"><text x="30" y="42" font-size="23" font-weight="bold">全会公报确认处分人数</text><text x="30" y="69" font-size="15">统一基准：376名委员及候补委员</text><text x="30" y="117" font-size="18">十八届</text><rect x="125" y="96" width="480" height="30" rx="4" fill="#e4e2da"/><rect x="125" y="96" width="280" height="30" rx="4" fill="#547d79"/><text x="415" y="117" font-size="17">35 · 9.31%</text><text x="30" y="181" font-size="18">十九届</text><rect x="125" y="160" width="480" height="30" rx="4" fill="#e4e2da"/><rect x="125" y="160" width="40" height="30" rx="4" fill="#547d79"/><text x="175" y="181" font-size="17">5 · 1.33%</text><text x="30" y="245" font-size="18">二十届</text><rect x="125" y="224" width="480" height="30" rx="4" fill="#e4e2da"/><rect x="125" y="224" width="408" height="30" rx="4" fill="#547d79"/><text x="543" y="245" font-size="17">51 · 13.56%</text><text x="30" y="315" font-size="14">来源：2014—2026年各届全会公报；二十届尚未结束。</text><text x="30" y="336" font-size="14">人数 ÷ 初始规模 ≠ 实际腐败率。</text></g></svg>