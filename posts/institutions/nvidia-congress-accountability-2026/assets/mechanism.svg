<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 548" role="img" aria-labelledby="t d"><title id="t">指控到事实的证据门槛</title><desc id="d">媒体线索经过官方质询、文件调查、独立核对才可能产生有限结论；政治动机的解释须单独检验，不能代替事实归责。</desc><rect width="1050" height="548" fill="#f8fafc" rx="26"/><text x="42" y="65" font-size="30" fill="#1a2d45" font-family="sans-serif" font-weight="700">EVIDENCE LADDER / 从指控到结论</text><text x="42" y="101" font-size="20" fill="#526579" font-family="sans-serif">公开调查是真实程序，不等于调查所指向的行为已经成立</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="44" y="158" width="223" height="146" rx="19" fill="#fff2e8" stroke="#d8a078"/><text x="155" y="211" font-size="27" fill="#8e5627" font-weight="700">01 · 线索</text><text x="155" y="254" font-size="19" fill="#865f41">报道与举报</text><rect x="291" y="158" width="223" height="146" rx="19" fill="#eaf2ff" stroke="#88a6cf"/><text x="402" y="211" font-size="27" fill="#275085" font-weight="700">02 · 质询</text><text x="402" y="254" font-size="19" fill="#426589">国会要求说明</text><rect x="538" y="158" width="223" height="146" rx="19" fill="#e7f7ef" stroke="#86bda3"/><text x="649" y="211" font-size="27" fill="#216b50" font-weight="700">03 · 核对</text><text x="649" y="254" font-size="19" fill="#437d65">证词 · 交易记录</text><rect x="785" y="158" width="223" height="146" rx="19" fill="#edeefb" stroke="#a0a4d0"/><text x="896" y="211" font-size="27" fill="#4e528a" font-weight="700">04 · 结论</text><text x="896" y="254" font-size="19" fill="#6d709d">有限且可修订</text></g><path d="M266 231h25m-13 -9 13 9 -13 9 M513 231h25m-13 -9 13 9 -13 9 M760 231h25m-13 -9 13 9 -13 9" fill="none" stroke="#8798aa" stroke-width="3"/><path d="M95 348h855" stroke="#bdc8d3" stroke-width="2" stroke-dasharray="8 9"/><rect x="125" y="377" width="800" height="96" rx="20" fill="#fff" stroke="#a6b5c7"/><text x="525" y="416" font-size="24" text-anchor="middle" fill="#253c55" font-family="sans-serif" font-weight="700">另一条分析支线：政治激励／历史类比</text><text x="525" y="450" font-size="18" text-anchor="middle" fill="#536779" font-family="sans-serif">只能提出假设；必须寻找反证，不能跨越上方的调查门槛</text></svg>