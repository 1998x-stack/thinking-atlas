<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">上海12345外包服务预算变化</title><desc id="desc">2023年23039万元，2024年24847万元，2025年22367万元。均为部门预算安排，不是实际支出。</desc><rect width="1000" height="620" fill="#f7f8f4"/><text x="55" y="65" font-size="30" fill="#173d3b" font-family="serif">上海12345外包服务预算</text><text x="55" y="98" font-size="16" fill="#6b7c77" font-family="sans-serif">单位：万元；部门预算安排，非最终决算</text><line x1="210" y1="500" x2="850" y2="500" stroke="#8b9993" stroke-width="2"/><g font-family="sans-serif"><rect x="285" y="205" width="120" height="295" rx="8" fill="#80a99b"/><rect x="480" y="182" width="120" height="318" rx="8" fill="#2d766c"/><rect x="675" y="215" width="120" height="285" rx="8" fill="#a06b49"/><g fill="#173d3b" font-size="21" text-anchor="middle"><text x="345" y="180">23,039</text><text x="540" y="157">24,847</text><text x="735" y="190">22,367</text><text x="345" y="540">2023</text><text x="540" y="540">2024</text><text x="735" y="540">2025</text></g></g><text x="55" y="585" font-size="15" fill="#657b75" font-family="sans-serif">预算波动不等于实际支出同比变化；人员聘用及管理经费也不等于个人工资总额。</text></svg>