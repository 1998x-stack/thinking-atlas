<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">12345热线责任链</title><desc id="desc">群众提交诉求、外包话务受理、热线管理机构派单、政府部门或公共服务单位办理、结果反馈和回访。</desc><rect width="1200" height="720" fill="#f4f5ef"/><text x="70" y="75" font-size="23" fill="#173d3b" font-family="sans-serif" font-weight="700">THINKING ATLAS / PUBLIC SERVICE</text><text x="70" y="145" font-size="46" fill="#173d3b" font-family="serif">一个入口，不等于一个责任主体</text><g font-family="sans-serif"><rect x="70" y="250" width="185" height="155" rx="12" fill="#dcebe3" stroke="#80a99b" stroke-width="2"/><text x="162" y="295" text-anchor="middle" fill="#276b5f" font-size="21" font-weight="700">群众</text><text x="162" y="345" text-anchor="middle" fill="#173d3b" font-size="18">电话 / 网络</text><text x="162" y="375" text-anchor="middle" fill="#607774" font-size="15">提交诉求</text><rect x="300" y="250" width="185" height="155" rx="12" fill="#e8eee5" stroke="#a8b9a9" stroke-width="2"/><text x="392" y="295" text-anchor="middle" fill="#657b58" font-size="21" font-weight="700">话务运营</text><text x="392" y="345" text-anchor="middle" fill="#173d3b" font-size="18">接听 / 记录</text><text x="392" y="375" text-anchor="middle" fill="#607774" font-size="15">辅助业务可外包</text><rect x="530" y="250" width="185" height="155" rx="12" fill="#f3e8df" stroke="#d1a98b" stroke-width="2"/><text x="622" y="295" text-anchor="middle" fill="#a06b49" font-size="21" font-weight="700">热线管理</text><text x="622" y="345" text-anchor="middle" fill="#173d3b" font-size="18">分类 / 派单</text><text x="622" y="375" text-anchor="middle" fill="#7c6757" font-size="15">规则 / 督办 / 数据</text><rect x="760" y="250" width="185" height="155" rx="12" fill="#e6edf0" stroke="#9db3bd" stroke-width="2"/><text x="852" y="295" text-anchor="middle" fill="#456978" font-size="21" font-weight="700">承办部门</text><text x="852" y="345" text-anchor="middle" fill="#173d3b" font-size="18">调查 / 办理</text><text x="852" y="375" text-anchor="middle" fill="#607b86" font-size="15">主体责任不外包</text><rect x="990" y="250" width="145" height="155" rx="12" fill="#eee8f1" stroke="#b9a9c3" stroke-width="2"/><text x="1062" y="295" text-anchor="middle" fill="#79638b" font-size="21" font-weight="700">反馈</text><text x="1062" y="345" text-anchor="middle" fill="#173d3b" font-size="18">回访</text><text x="1062" y="375" text-anchor="middle" fill="#84758f" font-size="15">闭环评价</text><g stroke="#2d766c" stroke-width="4" fill="none"><path d="M255 327 H300 M485 327 H530 M715 327 H760 M945 327 H990"/><path d="M286 315 L300 327 L286 339 M516 315 L530 327 L516 339 M746 315 L760 327 L746 339 M976 315 L990 327 L976 339"/></g><rect x="70" y="485" width="1065" height="105" rx="12" fill="#173d3b"/><text x="110" y="530" fill="#c5ddd1" font-size="18">责任原则</text><text x="110" y="570" fill="#fff" font-size="26" font-weight="700">话务和运维可以外包；诉求办理和行政责任不能一包了之</text></g></svg>