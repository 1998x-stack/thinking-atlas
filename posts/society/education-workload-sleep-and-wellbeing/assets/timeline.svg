<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">学生睡眠管理政策时间线</title><desc id="desc">2021教育部睡眠管理通知、2024江苏五项规范、2025教育部心理健康十条措施、2026年江苏部分高中作息调整。</desc><rect width="1100" height="540" fill="#f7f8f4"/><text x="55" y="65" font-size="30" fill="#173d3b" font-family="serif">政策演进：从睡眠底线到学校作息执行</text><line x1="150" y1="270" x2="950" y2="270" stroke="#8b9993" stroke-width="5"/><g font-family="sans-serif"><circle cx="180" cy="270" r="15" fill="#2d766c"/><circle cx="425" cy="270" r="15" fill="#2d766c"/><circle cx="670" cy="270" r="15" fill="#2d766c"/><circle cx="915" cy="270" r="15" fill="#a06b49"/><g fill="#173d3b" font-size="24" font-weight="700" text-anchor="middle"><text x="180" y="190">2021</text><text x="425" y="190">2024</text><text x="670" y="190">2025</text><text x="915" y="190">2026</text></g><g fill="#526c65" font-size="17" text-anchor="middle"><text x="180" y="320">教育部睡眠管理</text><text x="180" y="350">高中8小时</text><text x="425" y="320">江苏五项规范</text><text x="425" y="350">作息 / 作业 / 课程</text><text x="670" y="320">心理健康十条措施</text><text x="670" y="350">睡眠监测与支持</text><text x="915" y="320">部分高中调整</text><text x="915" y="350">到校和晚自习时间</text></g></g><text x="55" y="455" font-size="16" fill="#657b75" font-family="sans-serif">注：2026年报道涉及部分学校，不代表全省统一双休或所有高中采用同一时间表。</text></svg>