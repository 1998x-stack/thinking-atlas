<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">学校作息与学生身心健康因果路径</title><desc id="desc">作息调整可能影响睡眠、困倦和压力，但家庭条件、校园环境、心理疾病、同伴关系和社会支持也影响心理健康。</desc><rect width="1200" height="700" fill="#f4f5ef"/><text x="70" y="75" font-size="23" fill="#173d3b" font-family="sans-serif" font-weight="700">THINKING ATLAS / EDUCATION &amp; WELLBEING</text><text x="70" y="145" font-size="46" fill="#173d3b" font-family="serif">作息是一个因素，不是唯一原因</text><g font-family="sans-serif"><rect x="70" y="245" width="230" height="135" rx="12" fill="#dcebe3" stroke="#80a99b" stroke-width="2"/><text x="185" y="290" text-anchor="middle" fill="#276b5f" font-size="22" font-weight="700">政策调整</text><text x="185" y="335" text-anchor="middle" fill="#173d3b" font-size="18">到校 / 晚自习</text><rect x="365" y="245" width="230" height="135" rx="12" fill="#e8eee5" stroke="#a8b9a9" stroke-width="2"/><text x="480" y="290" text-anchor="middle" fill="#657b58" font-size="22" font-weight="700">时间预算</text><text x="480" y="335" text-anchor="middle" fill="#173d3b" font-size="18">作业 / 培训 / 通勤</text><rect x="660" y="245" width="230" height="135" rx="12" fill="#f3e8df" stroke="#d1a98b" stroke-width="2"/><text x="775" y="290" text-anchor="middle" fill="#a06b49" font-size="22" font-weight="700">睡眠与压力</text><text x="775" y="335" text-anchor="middle" fill="#173d3b" font-size="18">时长 / 质量 / 困倦</text><rect x="955" y="245" width="175" height="135" rx="12" fill="#e6edf0" stroke="#9db3bd" stroke-width="2"/><text x="1042" y="290" text-anchor="middle" fill="#456978" font-size="22" font-weight="700">结果</text><text x="1042" y="335" text-anchor="middle" fill="#173d3b" font-size="18">健康 / 学习</text><g stroke="#2d766c" stroke-width="4" fill="none"><path d="M300 312 H365 M595 312 H660 M890 312 H955"/><path d="M351 300 L365 312 L351 324 M646 300 L660 312 L646 324 M941 300 L955 312 L941 324"/></g><rect x="70" y="445" width="1060" height="135" rx="12" fill="#eee8f1" stroke="#b9a9c3" stroke-width="2"/><text x="110" y="490" fill="#79638b" font-size="22" font-weight="700">同时影响结果的混杂因素</text><text x="110" y="535" fill="#4e4855" font-size="20">家庭经济与关系 · 校园欺凌 · 心理疾病 · 同伴关系 · 网络使用 · 社会支持 · 求助可及性</text><text x="70" y="635" fill="#657b75" font-size="17">相关性不能自动证明因果；必须有基线、对照组和长期随访。</text></g></svg>