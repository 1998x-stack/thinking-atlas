<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">助人决策五关口</title><desc id="desc">五个候选决策阶段：察觉、判断、责任、方式、行动。</desc><rect width="720" height="360" rx="16" fill="#f5f3ee"/><g font-family="system-ui,sans-serif" fill="#263b42"><text x="360" y="53" text-anchor="middle" font-size="24" font-weight="bold">从看到事件，到采取行动</text><rect x="22" y="137" width="120" height="75" rx="12" fill="#dce3df"/><text x="82" y="181" text-anchor="middle" font-size="24">察觉</text><path d="M142 175h17m-7-6 7 6-7 6" fill="none" stroke="#536a68" stroke-width="2"/><rect x="161" y="137" width="120" height="75" rx="12" fill="#dce3df"/><text x="221" y="181" text-anchor="middle" font-size="24">判断</text><path d="M281 175h17m-7-6 7 6-7 6" fill="none" stroke="#536a68" stroke-width="2"/><rect x="300" y="137" width="120" height="75" rx="12" fill="#b6dcd3"/><text x="360" y="181" text-anchor="middle" font-size="24">责任</text><path d="M420 175h17m-7-6 7 6-7 6" fill="none" stroke="#536a68" stroke-width="2"/><rect x="439" y="137" width="120" height="75" rx="12" fill="#b6dcd3"/><text x="499" y="181" text-anchor="middle" font-size="24">方式</text><path d="M559 175h17m-7-6 7 6-7 6" fill="none" stroke="#536a68" stroke-width="2"/><rect x="578" y="137" width="120" height="75" rx="12" fill="#dce3df"/><text x="638" y="181" text-anchor="middle" font-size="24">行动</text><text x="360" y="270" text-anchor="middle" font-size="19">点名：责任归属　　具体任务：可行方式</text><text x="360" y="307" text-anchor="middle" font-size="15">解释模型，并非测量所得的因果图</text></g></svg>