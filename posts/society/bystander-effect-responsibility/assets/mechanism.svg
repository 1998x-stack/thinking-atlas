<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">泛化请求与明确请求</title><desc id="desc">左侧责任分散；右侧一个明确接收者，其他人仍可协作。概念图。</desc><rect width="720" height="360" rx="16" fill="#f5f3ee"/><g font-family="system-ui,sans-serif" fill="#263b42"><path d="M360 35V325" stroke="#c0c6c4"/><g text-anchor="middle" font-size="23" font-weight="bold"><text x="180" y="45">泛化求助</text><text x="540" y="45">指定对象与任务</text></g><circle cx="180" cy="183" r="39" fill="#e7c1a5"/><text x="180" y="188" text-anchor="middle" font-size="19">求助者</text><path d="M180 183L70 104" stroke="#9ca5a5" stroke-width="2" stroke-dasharray="5 7"/><circle cx="70" cy="104" r="29" fill="#d5dbd8"/><text x="70" y="109" text-anchor="middle" font-size="15" fill="#263b42">旁观者</text><path d="M180 183L290 104" stroke="#9ca5a5" stroke-width="2" stroke-dasharray="5 7"/><circle cx="290" cy="104" r="29" fill="#d5dbd8"/><text x="290" y="109" text-anchor="middle" font-size="15" fill="#263b42">旁观者</text><path d="M180 183L70 260" stroke="#9ca5a5" stroke-width="2" stroke-dasharray="5 7"/><circle cx="70" cy="260" r="29" fill="#d5dbd8"/><text x="70" y="265" text-anchor="middle" font-size="15" fill="#263b42">旁观者</text><path d="M180 183L290 260" stroke="#9ca5a5" stroke-width="2" stroke-dasharray="5 7"/><circle cx="290" cy="260" r="29" fill="#d5dbd8"/><text x="290" y="265" text-anchor="middle" font-size="15" fill="#263b42">旁观者</text><text x="180" y="322" text-anchor="middle" font-size="17">人人可能以为别人会行动</text><circle cx="540" cy="183" r="39" fill="#e7c1a5"/><text x="540" y="188" text-anchor="middle" font-size="19">求助者</text><path d="M540 183L430 104" stroke="#9ca5a5" stroke-width="2" stroke-dasharray="5 7"/><circle cx="430" cy="104" r="29" fill="#d5dbd8"/><text x="430" y="109" text-anchor="middle" font-size="15" fill="#263b42">旁观者</text><path d="M540 183L650 104" stroke="#287e75" stroke-width="5" stroke-dasharray="none"/><circle cx="650" cy="104" r="29" fill="#287e75"/><text x="650" y="109" text-anchor="middle" font-size="15" fill="white">接收者</text><path d="M540 183L430 260" stroke="#9ca5a5" stroke-width="2" stroke-dasharray="5 7"/><circle cx="430" cy="260" r="29" fill="#d5dbd8"/><text x="430" y="265" text-anchor="middle" font-size="15" fill="#263b42">旁观者</text><path d="M540 183L650 260" stroke="#9ca5a5" stroke-width="2" stroke-dasharray="5 7"/><circle cx="650" cy="260" r="29" fill="#d5dbd8"/><text x="650" y="265" text-anchor="middle" font-size="15" fill="#263b42">旁观者</text><text x="540" y="322" text-anchor="middle" font-size="17">责任明确，仍需确认</text></g></svg>