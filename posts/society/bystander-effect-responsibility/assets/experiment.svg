<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">1968年报告比例</title><desc id="desc">原论文表1：旁观者含本人分别为1、2、5；报告比例85、62、31%。</desc><rect width="720" height="360" rx="16" fill="#f5f3ee"/><g font-family="system-ui,sans-serif" fill="#263b42"><text x="360" y="40" text-anchor="middle" font-size="23" font-weight="bold">录音结束前报告的被试比例</text><text x="155" y="100" text-anchor="end" font-size="19">1 名旁观者</text><rect x="170" y="76" width="450" height="32" rx="4" fill="#e0e5e1"/><rect x="170" y="76" width="382.5" height="32" rx="4" fill="#397d76"/><text x="562.5" y="100" font-size="19">85%</text><text x="155" y="170" text-anchor="end" font-size="19">2 名旁观者</text><rect x="170" y="146" width="450" height="32" rx="4" fill="#e0e5e1"/><rect x="170" y="146" width="279" height="32" rx="4" fill="#397d76"/><text x="459" y="170" font-size="19">62%</text><text x="155" y="240" text-anchor="end" font-size="19">5 名旁观者</text><rect x="170" y="216" width="450" height="32" rx="4" fill="#e0e5e1"/><rect x="170" y="216" width="139.5" height="32" rx="4" fill="#397d76"/><text x="319.5" y="240" font-size="19">31%</text><text x="360" y="308" text-anchor="middle" font-size="17">Darley &amp; Latané (1968), Table 1, p. 380</text><text x="360" y="334" text-anchor="middle" font-size="14">分母 N = 13 / 26 / 13；非街头实际救助率</text></g></svg>