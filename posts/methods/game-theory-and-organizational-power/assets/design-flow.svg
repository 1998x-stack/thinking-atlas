<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">从识别博弈到制度设计</title><desc id="desc">识别参与者、收益、信息、重复互动和承诺，随后改变规则和激励。</desc><rect width="1000" height="580" fill="#f7f8f4"/><text x="55" y="65" font-size="30" fill="#173d3b" font-family="serif">从识别博弈到改变均衡</text><g font-family="sans-serif"><rect x="65" y="130" width="250" height="90" rx="12" fill="#dcebe3" stroke="#80a99b" stroke-width="2"/><text x="190" y="168" text-anchor="middle" fill="#276b5f" font-size="21" font-weight="700">识别参与者</text><text x="190" y="198" text-anchor="middle" fill="#173d3b" font-size="16">谁在决策？谁被遗漏？</text><rect x="375" y="130" width="250" height="90" rx="12" fill="#e8eee5" stroke="#a8b9a9" stroke-width="2"/><text x="500" y="168" text-anchor="middle" fill="#657b58" font-size="21" font-weight="700">识别收益与信息</text><text x="500" y="198" text-anchor="middle" fill="#173d3b" font-size="16">谁得到什么？知道什么？</text><rect x="685" y="130" width="250" height="90" rx="12" fill="#f3e8df" stroke="#d1a98b" stroke-width="2"/><text x="810" y="168" text-anchor="middle" fill="#a06b49" font-size="21" font-weight="700">识别承诺与重复</text><text x="810" y="198" text-anchor="middle" fill="#173d3b" font-size="16">能否退出？未来还会见面？</text><g stroke="#2d766c" stroke-width="4" fill="none"><path d="M315 175 H375 M625 175 H685"/><path d="M361 163 L375 175 L361 187 M671 163 L685 175 L671 187"/></g><rect x="220" y="330" width="560" height="115" rx="14" fill="#173d3b"/><text x="500" y="375" text-anchor="middle" fill="#c5ddd1" font-size="21">制度设计：改变收益、信息和执行规则</text><text x="500" y="415" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">让合作成为个体理性选择</text><path d="M810 220 C810 280 780 300 700 330" stroke="#2d766c" stroke-width="4" fill="none"/><path d="M690 318 L700 330 L716 326" fill="none" stroke="#2d766c" stroke-width="4"/><path d="M500 445 V495" stroke="#2d766c" stroke-width="4"/><path d="M488 481 L500 495 L512 481" fill="none" stroke="#2d766c" stroke-width="4"/><text x="500" y="540" text-anchor="middle" fill="#657b75" font-size="17">结果：新的均衡、可验证的合作与更低的组织摩擦</text></g></svg>