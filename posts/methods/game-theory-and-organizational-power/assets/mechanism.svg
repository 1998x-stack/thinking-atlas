<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">九种经典博弈结构</title><desc id="desc">囚徒困境、智猪博弈、斗鸡博弈、猎鹿博弈、协调博弈、志愿者困境、重复博弈、信号博弈和委托代理。</desc><rect width="1200" height="720" fill="#f4f5ef"/><text x="70" y="75" font-size="23" fill="#173d3b" font-family="sans-serif" font-weight="700">THINKING ATLAS / GAME THEORY</text><text x="70" y="145" font-size="46" fill="#173d3b" font-family="serif">不同的激励结构，产生不同的均衡</text><g font-family="sans-serif"><g><rect x="70" y="220" width="320" height="105" rx="12" fill="#dcebe3" stroke="#80a99b" stroke-width="2"/><text x="100" y="263" fill="#276b5f" font-size="22" font-weight="700">囚徒困境</text><text x="100" y="298" fill="#173d3b" font-size="17">个体理性 / 集体低效</text></g><g><rect x="440" y="220" width="320" height="105" rx="12" fill="#e8eee5" stroke="#a8b9a9" stroke-width="2"/><text x="470" y="263" fill="#657b58" font-size="22" font-weight="700">智猪博弈</text><text x="470" y="298" fill="#173d3b" font-size="17">成本不对称 / 搭便车</text></g><g><rect x="810" y="220" width="320" height="105" rx="12" fill="#f3e8df" stroke="#d1a98b" stroke-width="2"/><text x="840" y="263" fill="#a06b49" font-size="22" font-weight="700">斗鸡博弈</text><text x="840" y="298" fill="#173d3b" font-size="17">升级风险 / 谁先让步</text></g><g><rect x="70" y="365" width="320" height="105" rx="12" fill="#e6edf0" stroke="#9db3bd" stroke-width="2"/><text x="100" y="408" fill="#456978" font-size="22" font-weight="700">猎鹿博弈</text><text x="100" y="443" fill="#173d3b" font-size="17">高收益合作 / 信任协调</text></g><g><rect x="440" y="365" width="320" height="105" rx="12" fill="#eee8f1" stroke="#b9a9c3" stroke-width="2"/><text x="470" y="408" fill="#79638b" font-size="22" font-weight="700">协调博弈</text><text x="470" y="443" fill="#173d3b" font-size="17">焦点选择 / 标准统一</text></g><g><rect x="810" y="365" width="320" height="105" rx="12" fill="#e9eee8" stroke="#a7b7a6" stroke-width="2"/><text x="840" y="408" fill="#526d59" font-size="22" font-weight="700">志愿者困境</text><text x="840" y="443" fill="#173d3b" font-size="17">公共品 / 成本分担</text></g><g><rect x="70" y="510" width="320" height="105" rx="12" fill="#f3e8df" stroke="#d1a98b" stroke-width="2"/><text x="100" y="553" fill="#a06b49" font-size="22" font-weight="700">重复博弈</text><text x="100" y="588" fill="#173d3b" font-size="17">声誉 / 未来收益</text></g><g><rect x="440" y="510" width="320" height="105" rx="12" fill="#e6edf0" stroke="#9db3bd" stroke-width="2"/><text x="470" y="553" fill="#456978" font-size="22" font-weight="700">信号博弈</text><text x="470" y="588" fill="#173d3b" font-size="17">类型不明 / 信息传递</text></g><g><rect x="810" y="510" width="320" height="105" rx="12" fill="#dcebe3" stroke="#80a99b" stroke-width="2"/><text x="840" y="553" fill="#276b5f" font-size="22" font-weight="700">委托—代理</text><text x="840" y="588" fill="#173d3b" font-size="17">隐藏行动 / 指标激励</text></g></g></svg>