<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" role="img" aria-labelledby="t d"><title id="t">研究陌生行业的六层知识图谱</title><desc id="d">产业链、产品、技术、公司、人才、证据六个层级构成闭环。企业与人才匹配需要交叉验证，图为概念框架。</desc>
<rect width="1040" height="580" rx="26" fill="#f8fafc"/><text x="48" y="66" font-size="29" fill="#16233c" font-family="sans-serif" font-weight="700">INDUSTRY INTELLIGENCE  /  行业研究不是搜索清单</text><text x="48" y="105" font-size="18" fill="#59697f" font-family="sans-serif">从产品交付责任，反推技术、组织与人才；每一条关系都需要来源</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="60" y="152" width="280" height="126" rx="22" fill="#e9f1ff" stroke="#7895c3"/><text x="200" y="198" font-size="26" fill="#1b3f7c" font-weight="700">01 · 产业链</text><text x="200" y="236" font-size="19" fill="#385678">器件 · 整机 · 部署</text>
<rect x="380" y="152" width="280" height="126" rx="22" fill="#e7f8f1" stroke="#70ac99"/><text x="520" y="198" font-size="26" fill="#1d6653" font-weight="700">02 · 产品</text><text x="520" y="236" font-size="19" fill="#356f61">任务场景 · 验收</text>
<rect x="700" y="152" width="280" height="126" rx="22" fill="#fff3e8" stroke="#d49d70"/><text x="840" y="198" font-size="26" fill="#89542d" font-weight="700">03 · 技术</text><text x="840" y="236" font-size="19" fill="#916b51">硬件 · 控制 · VLA</text>
<rect x="60" y="332" width="280" height="126" rx="22" fill="#fff3e8" stroke="#d49d70"/><text x="200" y="378" font-size="26" fill="#89542d" font-weight="700">04 · 公司</text><text x="200" y="416" font-size="19" fill="#916b51">产品 · 商业 · 现金流</text>
<rect x="380" y="332" width="280" height="126" rx="22" fill="#e7f8f1" stroke="#70ac99"/><text x="520" y="378" font-size="26" fill="#1d6653" font-weight="700">05 · 人才</text><text x="520" y="416" font-size="19" fill="#356f61">岗位 · 交付责任</text>
<rect x="700" y="332" width="280" height="126" rx="22" fill="#e9f1ff" stroke="#7895c3"/><text x="840" y="378" font-size="26" fill="#1b3f7c" font-weight="700">06 · 证据</text><text x="840" y="416" font-size="19" fill="#385678">原始文件 · 反证</text></g>
