<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">1942年树叶训令：稀缺资源约束与军民互助</title>
<desc id="desc">概念流程：旱灾与封锁导致粮食短缺，树叶成为共同口粮；军队通过训令限制近村采摘，把资源留给群众，并承担更远距离采集成本；村民的回应与互助可能强化信任。该图是解释框架，不是统计因果图。</desc>
<defs>
  <marker id="arrowLeaf" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b97657"/></marker>
</defs>
<rect width="1000" height="440" rx="18" fill="#f1f5ef"/>
<text x="42" y="42" font-family="sans-serif" font-size="13" letter-spacing="2" font-weight="700" fill="#8a654f">RESOURCE ETHICS UNDER EXTREME SCARCITY</text>
<text x="42" y="78" font-family="sans-serif" font-size="22" font-weight="700" fill="#203539">训令的关键：军队先约束自身对稀缺资源的获取</text>
<g font-family="sans-serif">
  <rect x="42" y="125" width="180" height="90" rx="11" fill="#fff" stroke="#d4dfd6"/>
  <text x="132" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#203539">旱灾与封锁</text>
  <text x="132" y="184" text-anchor="middle" font-size="12" fill="#687c7c">粮食供给骤减</text>
  <path d="M222 170H250" stroke="#b97657" stroke-width="2.5" marker-end="url(#arrowLeaf)"/>
  <rect x="260" y="125" width="180" height="90" rx="11" fill="#fff" stroke="#d4dfd6"/>
  <text x="350" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#203539">共同依赖树叶</text>
  <text x="350" y="184" text-anchor="middle" font-size="12" fill="#687c7c">军民口粮发生重叠</text>
  <path d="M440 170H468" stroke="#b97657" stroke-width="2.5" marker-end="url(#arrowLeaf)"/>
  <rect x="478" y="125" width="180" height="90" rx="11" fill="#dcebe1" stroke="#9bb9a8"/>
  <text x="568" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#183d40">发布训令</text>
  <text x="568" y="184" text-anchor="middle" font-size="12" fill="#58736b">近村树叶留给群众</text>
  <path d="M658 170H686" stroke="#b97657" stroke-width="2.5" marker-end="url(#arrowLeaf)"/>
  <rect x="696" y="125" width="260" height="90" rx="11" fill="#fff" stroke="#d4dfd6"/>
  <text x="826" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#203539">军队承担额外成本</text>
  <text x="826" y="184" text-anchor="middle" font-size="12" fill="#687c7c">远离村庄采集 / 节粮 / 生产自救</text>
</g>
<path d="M826 215V260H350V215" fill="none" stroke="#b97657" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowLeaf)"/>
<text x="588" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a654f">自我约束不是没有代价：它改变了资源获取的顺序和成本承担者</text>
<g font-family="sans-serif">
  <rect x="100" y="323" width="340" height="70" rx="10" fill="#fff" stroke="#c6d7cd"/>
  <text x="270" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#176b70">军民互助与信任</text>
  <text x="270" y="375" text-anchor="middle" font-size="11" fill="#687c7c">来自回忆材料的行为叙述，因果强度仍需谨慎</text>
  <rect x="560" y="323" width="340" height="70" rx="10" fill="#fff" stroke="#c6d7cd"/>
  <text x="730" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#176b70">纪律成为组织能力</text>
  <text x="730" y="375" text-anchor="middle" font-size="11" fill="#687c7c">原则被转化为可执行的部队约束</text>
  <path d="M440 358H560" stroke="#176b70" stroke-width="2" marker-end="url(#arrowLeaf)"/>
</g>
<text x="500" y="421" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#687c7c">概念机制图：不表示训令单独造成军民关系变化，也不代表所有单位执行情况</text>
</svg>