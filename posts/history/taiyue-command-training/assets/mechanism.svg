<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc">
<title id="title">基层指挥能力如何形成：任务转化与组织学习</title>
<desc id="desc">上半部分展示命令如何被连排干部转化为地形路线、敌情判断、火力阵地、通信补给和临机预案；下半部分展示实战经验经复盘、教材教员、分层训练和考核，再回到部队形成反馈循环。该图是概念机制图，不是统计数据。</desc>
<defs>
  <marker id="arrowA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b97657"/></marker>
  <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176b70"/></marker>
</defs>
<rect width="1040" height="510" rx="18" fill="#f1f5ef"/>
<text x="48" y="42" font-family="sans-serif" font-size="13" letter-spacing="2" font-weight="700" fill="#8a654f">FROM ORDER TO COMMAND CAPABILITY</text>
<text x="48" y="78" font-family="sans-serif" font-size="22" font-weight="700" fill="#203539">一条命令，必须经过多层判断才能成为可执行行动</text>
<rect x="48" y="112" width="142" height="76" rx="10" fill="#183d40"/>
<text x="119" y="143" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">任务命令</text>
<text x="119" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d8e7df">目标 / 时间 / 任务</text>
<path d="M190 150H222" stroke="#b97657" stroke-width="2.5" marker-end="url(#arrowA)"/>
<g font-family="sans-serif">
  <rect x="232" y="112" width="142" height="76" rx="10" fill="#fff" stroke="#c6d7cd"/>
  <text x="303" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#176b70">地形与路线</text>
  <text x="303" y="166" text-anchor="middle" font-size="11" fill="#687c7c">地图 / 时间 / 通路</text>
  <path d="M374 150H394" stroke="#b97657" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <rect x="404" y="112" width="142" height="76" rx="10" fill="#fff" stroke="#c6d7cd"/>
  <text x="475" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#176b70">敌情判断</text>
  <text x="475" y="166" text-anchor="middle" font-size="11" fill="#687c7c">方向 / 威胁 / 变化</text>
  <path d="M546 150H566" stroke="#b97657" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <rect x="576" y="112" width="142" height="76" rx="10" fill="#fff" stroke="#c6d7cd"/>
  <text x="647" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#176b70">火力与阵地</text>
  <text x="647" y="166" text-anchor="middle" font-size="11" fill="#687c7c">射击纪律 / 工事</text>
  <path d="M718 150H738" stroke="#b97657" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <rect x="748" y="112" width="112" height="76" rx="10" fill="#fff" stroke="#c6d7cd"/>
  <text x="804" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#176b70">保障</text>
  <text x="804" y="166" text-anchor="middle" font-size="11" fill="#687c7c">通信 / 给养</text>
  <path d="M860 150H880" stroke="#b97657" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <rect x="890" y="112" width="102" height="76" rx="10" fill="#dcebe1" stroke="#9bb9a8"/>
  <text x="941" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#183d40">预案</text>
  <text x="941" y="166" text-anchor="middle" font-size="11" fill="#58736b">协同 / 应变</text>
</g>
<path d="M941 188V223H119V188" fill="none" stroke="#b97657" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowA)"/>
<text x="520" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a654f">执行不是照读命令：情况变化时，必须判断、协调并修正</text>
<line x1="48" y1="274" x2="992" y2="274" stroke="#d4dfd6"/>
<text x="48" y="309" font-family="sans-serif" font-size="13" letter-spacing="2" font-weight="700" fill="#8a654f">ORGANIZATIONAL LEARNING LOOP</text>
<g font-family="sans-serif">
  <rect x="48" y="344" width="178" height="82" rx="10" fill="#fff" stroke="#c6d7cd"/>
  <text x="137" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="#203539">实战经验</text>
  <text x="137" y="400" text-anchor="middle" font-size="11" fill="#687c7c">成功 / 失误 / 代价</text>
  <path d="M226 385H252" stroke="#176b70" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <rect x="262" y="344" width="178" height="82" rx="10" fill="#fff" stroke="#c6d7cd"/>
  <text x="351" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="#203539">复盘与教材</text>
  <text x="351" y="400" text-anchor="middle" font-size="11" fill="#687c7c">把经验变成可教内容</text>
  <path d="M440 385H466" stroke="#176b70" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <rect x="476" y="344" width="178" height="82" rx="10" fill="#fff" stroke="#c6d7cd"/>
  <text x="565" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="#203539">分层训练</text>
  <text x="565" y="400" text-anchor="middle" font-size="11" fill="#687c7c">班 / 连排 / 营团</text>
  <path d="M654 385H680" stroke="#176b70" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <rect x="690" y="344" width="178" height="82" rx="10" fill="#fff" stroke="#c6d7cd"/>
  <text x="779" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="#203539">考核与轮训</text>
  <text x="779" y="400" text-anchor="middle" font-size="11" fill="#687c7c">检验 / 纠错 / 再训练</text>
  <path d="M868 385H894" stroke="#176b70" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <rect x="904" y="344" width="88" height="82" rx="10" fill="#183d40"/>
  <text x="948" y="376" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">部队</text>
  <text x="948" y="400" text-anchor="middle" font-size="11" fill="#d8e7df">再实践</text>
</g>
<text x="520" y="473" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#687c7c">概念机制图：说明能力生成路径，不代表历史训练效果的定量测量</text>
</svg>