<title id="title">东北三城与锦州战略关系示意</title><desc id="desc">不按实际比例排列的概念示意：长春连接沈阳，沈阳连接锦州，锦州连接关内；锦州方向在铁路陆上通道形成关口，且面对锦西援军和沈阳方向增援。</desc>
