<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t d"><title id="t">同盟冲突的两种处理路径</title><desc id="d">同一政策分歧可能经平等谈判协调，也可能因权威争议升级；不是历史必然路径。</desc><rect width="720" height="290" rx="12" fill="#f5f5f0"/><g font-family="sans-serif" text-anchor="middle" fill="#263a3a"><rect x="215" y="16" width="290" height="48" rx="10" fill="#d9e3eb" stroke="#50758a"/><text x="360" y="47" font-size="21">国家间政策分歧</text><g stroke="#657b78" stroke-dasharray="6 5" stroke-width="2" fill="none"><path d="M360 64 V83 H185 V100"/><path d="M360 83 H535 V100"/><path d="M185 151 V176"/><path d="M535 151 V176"/></g><g fill="#e1ede8" stroke="#40786d"><rect x="30" y="100" width="310" height="51" rx="10"/><rect x="30" y="176" width="310" height="51" rx="10"/></g><g fill="#f4e9da" stroke="#a5713f"><rect x="380" y="100" width="310" height="51" rx="10"/><rect x="380" y="176" width="310" height="51" rx="10"/></g><g font-size="19"><text x="185" y="132">主权平等与具体谈判</text><text x="535" y="132">正统性与领导权争议</text><text x="185" y="208">可能形成有限妥协</text><text x="535" y="208">可能抬高妥协成本</text></g><text x="360" y="265" font-size="16">概念路径；实际结果仍依赖外部安全、资源与组织条件</text></g></svg>