<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t d"><title id="t">同盟决策的四个解释层次</title><desc id="d">国家利益、党际权威、安全风险和经济依赖是四类候选解释。虚线表示待检验关系，不代表因果已确认。</desc><rect width="720" height="390" rx="14" fill="#f5f5f0"/><g font-family="sans-serif" text-anchor="middle" fill="#253b3b"><text x="360" y="39" font-size="22" font-weight="bold">共同理念为何不能保证同盟稳定？</text><g fill="#e1ede8" stroke="#40786d"><rect x="32" y="70" width="306" height="83" rx="12"/><rect x="382" y="70" width="306" height="83" rx="12"/></g><g fill="#f4e9da" stroke="#a5713f"><rect x="32" y="188" width="306" height="83" rx="12"/><rect x="382" y="188" width="306" height="83" rx="12"/></g><g font-size="21" font-weight="bold"><text x="185" y="103">国家利益</text><text x="535" y="103">党际权威</text><text x="185" y="221">安全风险</text><text x="535" y="221">经济依赖</text></g><g font-size="16"><text x="185" y="129">领土、主权、战略权益</text><text x="535" y="129">路线、正统性、领导权</text><text x="185" y="247">干预预期、外部威胁</text><text x="535" y="247">援助、贸易、替代选项</text></g><g stroke="#657b78" stroke-width="2" stroke-dasharray="6 5" fill="none"><path d="M185 153 V169 H360 V290"/><path d="M535 153 V169 H360"/><path d="M185 271 V282 H360"/><path d="M535 271 V282 H360"/></g><rect x="185" y="300" width="350" height="52" rx="10" fill="#d9e3eb" stroke="#50758a"/><text x="360" y="332" font-size="21" font-weight="bold">政策选择与同盟关系</text><text x="360" y="375" font-size="14">虚线 = 候选解释，非已识别因果；无统计数值</text></g></svg>