<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 245" role="img" aria-labelledby="t d"><title id="t">目标与条件的竞争解释</title><desc id="d">战略权益解释行动目标，美国介入预期解释风险条件。两者是否共同影响决策需要史料验证。</desc><rect width="720" height="245" rx="12" fill="#f5f5f0"/><g font-family="sans-serif" text-anchor="middle" fill="#263a3a"><rect x="30" y="22" width="310" height="76" rx="10" fill="#e1ede8" stroke="#40786d"/><rect x="380" y="22" width="310" height="76" rx="10" fill="#f4e9da" stroke="#a5713f"/><text x="185" y="53" font-size="22" font-weight="bold">行动目标</text><text x="185" y="80" font-size="17">远东战略权益</text><text x="535" y="53" font-size="22" font-weight="bold">风险条件</text><text x="535" y="80" font-size="17">美国介入预期</text><g stroke="#657b78" stroke-dasharray="6 5" stroke-width="2" fill="none"><path d="M185 98 V122 H360 V146"/><path d="M535 98 V122 H360"/></g><rect x="190" y="146" width="340" height="53" rx="10" fill="#d9e3eb" stroke="#50758a"/><text x="360" y="180" font-size="20" font-weight="bold">斯大林政策变化？</text><text x="360" y="228" font-size="16">两种解释可能互补，不能单独证明因果</text></g></svg>