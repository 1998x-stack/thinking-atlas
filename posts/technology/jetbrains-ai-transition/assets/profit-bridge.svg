<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="profit-bridge-t profit-bridge-d" viewBox="0 0 720 310" data-export="profit-bridge.svg" font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><title id="profit-bridge-t">净利润变化桥</title><desc id="profit-bridge-d">2024 净利润 24.79 亿，营业利润减少 12.91 亿，其余税前项目减少 20.16 亿，税项改善 5.13 亿，最终负 3.15 亿。</desc><path d="M18 225 H710" stroke="#829598"/><rect x="35" y="76.25999999999999" width="94" height="148.74" fill="#147f80" rx="4"/><text x="82" y="67.25999999999999" fill="#147f80" font-size="17" text-anchor="middle" font-weight="700">24.79</text><text x="82" y="292" fill="#203035" font-size="15" text-anchor="middle" font-weight="400">2024 净利</text><path d="M129 76.25999999999999 H172" stroke="#829598" stroke-dasharray="5 4"/><rect x="172" y="76.25999999999999" width="94" height="77.46" fill="#d06d4d" rx="4"/><text x="219" y="67.25999999999999" fill="#d06d4d" font-size="17" text-anchor="middle" font-weight="700">-12.91</text><text x="219" y="292" fill="#203035" font-size="15" text-anchor="middle" font-weight="400">营业利润变化</text><path d="M266 153.72 H309" stroke="#829598" stroke-dasharray="5 4"/><rect x="309" y="153.72" width="94" height="120.96000000000001" fill="#d06d4d" rx="4"/><text x="356" y="144.72" fill="#d06d4d" font-size="17" text-anchor="middle" font-weight="700">-20.16</text><text x="356" y="292" fill="#203035" font-size="15" text-anchor="middle" font-weight="400">财务等税前变化</text><path d="M403 274.68 H446" stroke="#829598" stroke-dasharray="5 4"/><rect x="446" y="243.9" width="94" height="30.779999999999994" fill="#7461ba" rx="4"/><text x="493" y="234.9" fill="#7461ba" font-size="17" text-anchor="middle" font-weight="700">+5.13</text><text x="493" y="292" fill="#203035" font-size="15" text-anchor="middle" font-weight="400">税项变化</text><path d="M540 243.9 H583" stroke="#829598" stroke-dasharray="5 4"/><rect x="583" y="225" width="94" height="18.9" fill="#d06d4d" rx="4"/><text x="630" y="216" fill="#d06d4d" font-size="17" text-anchor="middle" font-weight="700">-3.15</text><text x="630" y="292" fill="#203035" font-size="15" text-anchor="middle" font-weight="400">2025 净利</text></svg>
