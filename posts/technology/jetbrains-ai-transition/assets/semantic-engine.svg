<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="semantic-engine-t semantic-engine-d" viewBox="0 0 720 250" data-export="semantic-engine.svg" font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><title id="semantic-engine-t">静态分析不是文本替换</title><desc id="semantic-engine-d">代码解析产生语义结构，查询可解析引用后执行受控重构。</desc><rect x="25" y="28" width="300" height="78" rx="12" fill="#ffecd9"/><text x="175.0" y="61.0" fill="#203035" font-size="19" text-anchor="middle" font-weight="600">代码文本</text><text x="175.0" y="87.0" fill="#203035" font-size="19" text-anchor="middle" font-weight="400">同名不等于同一符号</text><rect x="395" y="28" width="300" height="78" rx="12" fill="#d6f1eb"/><text x="545.0" y="61.0" fill="#203035" font-size="19" text-anchor="middle" font-weight="600">语言解析 + 索引</text><text x="545.0" y="87.0" fill="#203035" font-size="19" text-anchor="middle" font-weight="400">声明、作用域、类型</text><path d="M325 67 L395 67" stroke="#147f80" stroke-width="3" fill="none"/><polygon points="395.0,67.0 386.2,71.8 386.2,62.2" fill="#147f80"/><path d="M545 106 L545 148" stroke="#147f80" stroke-width="3" fill="none"/><polygon points="545.0,148.0 540.2,139.2 549.8,139.2" fill="#147f80"/><rect x="395" y="148" width="300" height="78" rx="12" fill="#d6f1eb"/><text x="545.0" y="181.0" fill="#203035" font-size="19" text-anchor="middle" font-weight="600">语义查询</text><text x="545.0" y="207.0" fill="#203035" font-size="19" text-anchor="middle" font-weight="400">引用 / 类型 / 诊断</text><path d="M395 187 L325 187" stroke="#147f80" stroke-width="3" fill="none"/><polygon points="325.0,187.0 333.8,182.2 333.8,191.8" fill="#147f80"/><rect x="25" y="148" width="300" height="78" rx="12" fill="#ebe5ff"/><text x="175.0" y="181.0" fill="#203035" font-size="19" text-anchor="middle" font-weight="600">受控重构</text><text x="175.0" y="207.0" fill="#203035" font-size="19" text-anchor="middle" font-weight="400">预览变更 + 校验</text></svg>
