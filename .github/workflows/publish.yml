name: Validate and publish Thinking Atlas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser QA tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Check vendor Skill mirrors
        run: python scripts/sync_skills.py --check
      - name: Build website
        run: python scripts/build_site.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate taxonomy, source evidence and all internal links
        run: python scripts/validate_site.py
      - name: Browser QA (desktop and two phone sizes)
        run: python scripts/browser_check.py --output reports/browser
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: reports/browser/
          if-no-files-found: ignore
      - name: Prepare Pages deployment artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
